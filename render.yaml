# Render Blueprint (isteğe bağlı): Render panelinde "New + → Blueprint" ile bu dosyadan kurulabilir.
services:
  - type: web
    name: kampus-takas
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /backend/public/api/health
    # Hafta 9: harici API anahtarları. "sync: false" → değer GitHub'a yazılmaz, Render panelinde girilir.
    envVars:
      - key: CLOUDINARY_URL
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
