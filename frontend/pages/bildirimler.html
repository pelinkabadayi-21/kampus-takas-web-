<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bildirimler – Kampüs Takas</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header class="navbar">
    <a href="../index.html" class="logo">📚 Kampüs Takas</a>
    <nav id="main-nav"><a href="../index.html">Ana Sayfa</a><a href="ilanlar.html">İlanlar</a></nav>
  </header>
  <main class="container medium">
    <div class="card-head" style="margin-top:28px">
      <h1 class="page-title" style="margin:0">🔔 Bildirimler</h1>
      <button class="btn btn-outline" id="read-all">Tümünü okundu yap</button>
    </div>
    <div id="list" class="card"><p class="muted">Yükleniyor…</p></div>
  </main>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    const ICON = { mesaj: '💬', teklif: '🔄', teklif_sonuc: '📣', degerlendirme: '⭐', sistem: 'ℹ️' };
    document.addEventListener('DOMContentLoaded', async () => {
      try { await requireLogin(); } catch (e) { return; }
      const list = document.getElementById('list');
      async function load() {
        const { data } = await apiGet('/notifications');
        list.innerHTML = data.map(n => `
          <a class="notif ${n.is_read == 1 ? '' : 'unread'}" href="${esc(n.link || '#')}" data-id="${n.id}">
            <span class="notif-icon">${ICON[n.type] || '•'}</span>
            <span class="notif-text">${esc(n.content)}<br><small class="muted">${timeAgo(n.created_at)}</small></span>
          </a>`).join('') || '<p class="muted">Bildiriminiz yok.</p>';
      }
      // Tıklanan bildirim okundu yapılır, sonra ilgili sayfaya gidilir
      list.addEventListener('click', async e => {
        const a = e.target.closest('.notif'); if (!a) return;
        e.preventDefault();
        try { await apiPut(`/notifications/${a.dataset.id}/read`); } catch (err) {}
        // Bildirim linkleri sadece site içi sayfa adlarıdır (sunucu üretir); yine de dış adrese gitme
        const href = a.getAttribute('href');
        if (href && href !== '#' && !/^[a-z]+:|^\/\//i.test(href)) location.href = href; else load();
      });
      document.getElementById('read-all').addEventListener('click', async () => { await apiPut('/notifications/read-all'); load(); refreshCounts(); });
      load();
    });
  </script>
</body>
</html>
