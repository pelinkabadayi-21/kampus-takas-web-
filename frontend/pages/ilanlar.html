<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>İlanlar – Kampüs Takas</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header class="navbar">
    <a href="../index.html" class="logo">📚 Kampüs Takas</a>
    <nav id="main-nav"><a href="../index.html">Ana Sayfa</a><a href="ilanlar.html">İlanlar</a></nav>
  </header>

  <main class="container">
    <h1 class="page-title">İlanlar</h1>

    <form id="filters" class="card filters">
      <input type="search" name="q" placeholder="Kitap, eşya ara…">
      <select name="category_id"><option value="">Tüm kategoriler</option></select>
      <select name="listing_type">
        <option value="">Tüm türler</option>
        <option value="satis">Satılık</option>
        <option value="takas">Takas</option>
        <option value="bagis">Bağış</option>
      </select>
      <select name="item_condition">
        <option value="">Her durum</option>
        <option value="yeni">Yeni</option>
        <option value="cok_iyi">Çok iyi</option>
        <option value="iyi">İyi</option>
        <option value="orta">Orta</option>
        <option value="yipranmis">Yıpranmış</option>
      </select>
      <input type="number" name="min_price" placeholder="Min ₺" min="0">
      <input type="number" name="max_price" placeholder="Max ₺" min="0">
      <select name="sort">
        <option value="yeni">En yeni</option>
        <option value="ucuz">En ucuz</option>
        <option value="pahali">En pahalı</option>
      </select>
      <button class="btn" type="submit">Ara</button>
    </form>

    <p id="result-info" class="muted"></p>
    <div id="grid" class="listing-grid"></div>
    <div style="text-align:center;margin-top:20px"><button id="more" class="btn btn-outline" hidden>Daha fazla göster</button></div>
  </main>

  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/ilanlar.js"></script>
</body>
</html>
