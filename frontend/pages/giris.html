<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giriş – Kampüs Takas</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header class="navbar">
    <a href="../index.html" class="logo">📚 Kampüs Takas</a>
    <nav id="main-nav"><a href="../index.html">Ana Sayfa</a><a href="ilanlar.html">İlanlar</a></nav>
  </header>

  <main class="container narrow">
    <form id="login-form" class="card form-card" novalidate>
      <h1>Giriş Yap</h1>
      <div id="form-msg"></div>
      <div class="field">
        <label for="email">E-posta</label>
        <input type="email" id="email" name="email" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">Parola</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <button class="btn btn-block" type="submit">Giriş Yap</button>
      <p class="muted center">Hesabın yok mu? <a href="kayit.html">Kayıt ol</a></p>
    </form>
  </main>

  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/giris.js"></script>
</body>
</html>
